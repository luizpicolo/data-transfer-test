services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    container_name: data_transfer_test_app
    environment:
      RACK_ENV: production
      RAILS_ENV: production
    ports:
      - "4567:4567"
    volumes:
      - app_database:/db

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["cron", "-f"]
    environment:
      RACK_ENV: production
      RAILS_ENV: production
    volumes:
      - app_database:/db
      
volumes:
  app_database:
    external: true
    name: data_transfer_test_database